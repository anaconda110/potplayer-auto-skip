; ============================================================
; PotPlayer Auto Skip - per-series skip configuration
; Edit while the daemon is running: changes apply immediately.
;
; Recommended workflow: play episode 1 of a new show and tap the
; global hotkeys at the right moments (player can be in background):
;   Ctrl+Alt+1  when the OP ends        -> writes op_end
;   Ctrl+Alt+2  when the ED starts      -> writes ed_start
;   Ctrl+Alt+3  when the ED ends        -> writes ed_end (optional)
; Every following episode skips automatically. Tap again anytime to re-
; calibrate. Ctrl+Alt+0 pauses/resumes skipping, tray icon quits.
;
; [global]
;   enabled    = 1        master switch (also toggled by Ctrl+Alt+0)
;   apply_from = 2        start auto-skipping from episode N (1 = all)
;
; Series section: section name = show folder name (matched as \Name\
; anywhere in the played file's full path).
;   op_start  sec|h:mm:ss  with op_end: keep the cold open, and once
;                          playback naturally crosses op_start, jump to
;                          op_end (skips only the OP song)
;   op_end    sec|h:mm:ss  alone (no op_start): on episode open, if
;                          playback is before this point, jump here
;                          (skips cold open + OP together)
;   ed_start  sec|h:mm:ss  when playback naturally crosses this, skip
;                          to ed_end (0 = keep the ending)
;   ed_end    sec|h:mm:ss  seek target after ed_start; empty = jump near
;                          file end so PotPlayer advances to next episode
;
; Per-episode override (optional): [Show\05] matches files whose NAME
; contains "05" and overrides non-zero keys of the series section.
;   e.g. a longer final ED:  [My Show\12]  ed_start = 21:05
; ============================================================

[global]
enabled = 1
apply_from = 2

[paths]
; Library root: used only to derive the section name when a hotkey
; captures an unknown show (first folder component below root).
; Leave empty to use the file's parent folder instead.
root =

; ---------- Example (remove leading ';' to enable) ----------
; [My Favorite Show]
; op_start = 0:45
; op_end = 2:15
; ed_start = 22:10
; ed_end = 23:20
;
; [My Favorite Show\12]
; ed_start = 21:40
