; ============================================================
; PotPlayer Auto Skip - per-series skip configuration
; Edit while the daemon is running: changes apply immediately.
;
; Quick start: a show only needs TWO times.
;   op_end   = when the intro (OP) ends   -> every open jumps here
;   ed_start = when the outro (ED) starts -> playback skips to the end
;
; Easiest way to get them: play episode 1 and tap the global hotkeys
; at the right moments (player can stay in the background):
;   Ctrl+Alt+1  -> writes op_end      Ctrl+Alt+2  -> writes ed_start
; From the next episode on, everything is automatic.
; Ctrl+Alt+0 pauses/resumes skipping; the tray icon menu quits.
;
; [global]
;   enabled    = 1     master switch (written back by Ctrl+Alt+0)
;   apply_from = 2     start auto-skipping from episode N (1 = all)
;
; [paths]
;   root =            media library root; used only to name sections
;                     captured by hotkeys (first folder below root).
;                     Empty = use the file's parent folder.
;
; Series section: section name = show folder name (matched as \Name\
; anywhere in the played file's full path). Times accept seconds or
; h:mm:ss.
;
; [My Favorite Show]
; op_end = 2:15        ; intro time: jump here on open (cold open + OP)
; ed_start = 22:10     ; outro time: from here, skip to the end
;
; ------------------------------------------------------------
; Advanced options (all optional)
;
; Keep the cold open (skip only the OP song):
;   op_start pairs with op_end - the cold open plays normally, and once
;   playback naturally crosses op_start it jumps to op_end.
;   op_start = 0:45
;
; Keep what follows the ED (preview / end card):
;   ed_end = where to land after ed_start; empty = jump near the file
;   end so PotPlayer advances to the next episode. Hotkey: Ctrl+Alt+3.
;   ed_end = 23:20
;
; Per-episode override: [Show\05] matches files whose NAME contains
; "05" and overrides non-zero keys of the series section, e.g. a
; longer final ED:
;   [My Favorite Show\12]
;   ed_start = 21:40
; ============================================================

[global]
enabled = 1
apply_from = 2

[paths]
root =

; [My Favorite Show]
; op_end = 2:15
; ed_start = 22:10
